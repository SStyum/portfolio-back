services:
  postgres:
    container_name: portfolio-pg
    image: pgvector/pgvector:pg17
    ports:
      - 5450:5432
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: portfolio
      PGDATA: /data/postgres

  # Emula S3, SQS e Secrets Manager localmente (http://localhost:4566)
  localstack:
    container_name: portfolio-localstack
    image: localstack/localstack:4.12
    ports:
      - 4566:4566
    environment:
      SERVICES: s3,sqs,secretsmanager
    volumes:
      - ./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh

  rabbitmq:
    container_name: portfolio-rabbitmq
    image: rabbitmq:4.1-management
    ports:
      - 5672:5672   # AMQP
      - 15672:15672 # painel de administração (docker/docker)
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-portfolio.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro

  prometheus:
    container_name: portfolio-prometheus
    image: prom/prometheus:v3.5.0
    ports:
      - 9090:9090
    extra_hosts:
      - host.docker.internal:host-gateway # pra raspar a API que roda fora do Docker
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    container_name: portfolio-grafana
    image: grafana/grafana:12.1.0
    ports:
      - 3000:3000
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
