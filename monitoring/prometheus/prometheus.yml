global:
  scrape_interval: 15s

scrape_configs:
  # API rodando na máquina (npm run start:dev)
  - job_name: portfolio-api
    static_configs:
      - targets: ['host.docker.internal:3333']

  # Plugin rabbitmq_prometheus — per-object traz métricas por fila
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ['rabbitmq:15692']
